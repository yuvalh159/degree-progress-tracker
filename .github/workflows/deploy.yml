name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Or your default branch, e.g., master

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Specify your project's Node.js version

      - name: Create .env.local file
        run: |
          echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env.local
          echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env.local
          echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env.local
          echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env.local
          echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env.local
          echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env.local
        shell: bash

      - name: Install dependencies
        run: npm ci

      - name: Build project
        # The VITE_BASE_URL environment variable is used by Vite to set the correct base path for assets.
        # It should be your repository name, preceded and followed by a slash.
        # e.g., if your repo is https://github.com/your-username/your-repo-name, 
        # then VITE_BASE_URL should be /your-repo-name/
        run: npm run build
        env:
          VITE_BASE_URL: /degree-progress-tracker/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Default output directory for Vite builds

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4 